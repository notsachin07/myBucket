<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="View uploaded images">
</head>
<body>
  <nav>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="icon-btn" title="Back to Upload">
        <svg viewBox="0 0 24 24"><path d="M20,11H7.83l5.59-5.59L12,4l-8,8l8,8l1.41-1.41L7.83,13H20V11z"/></svg>
      </a>
      <h1 class="title">Photo Gallery</h1>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="btn-refresh" title="Refresh">
        <svg viewBox="0 0 24 24"><path d="M17.65,6.35C16.2,4.9,14.21,4,12,4c-4.42,0-7.99,3.58-7.99,8s3.57,8,7.99,8c3.73,0,6.84-2.55,7.73-6h-2.08 c-0.82,2.33-3.04,4-5.65,4c-3.31,0-6-2.69-6-6s2.69-6,6-6c1.66,0,3.14,0.69,4.22,1.78L13,11h7V4L17.65,6.35z"/></svg>
      </button>
    </div>
  </nav>

  <main class="gallery-container">
    <div id="gallery-status" style="text-align: center; margin-top: 2rem;">
      <div class="loader" id="gallery-loader" style="border-color: rgba(255,255,255,0.1); border-top-color: var(--primary-color); display: inline-block;"></div>
      <p id="gallery-message" style="margin-top: 1rem; color: var(--text-muted);"></p>
    </div>
    
    <div id="gallery-content"></div>
  </main>

  <!-- Image Detail Modal -->
  <div class="modal-overlay" id="image-detail-modal">
    <div class="modal-content">
      <div class="detail-image-container">
        <img id="detail-img" src="" alt="Preview">
        <div class="detail-actions">
          <button class="icon-btn" id="btn-delete" title="Delete Image">
            <svg viewBox="0 0 24 24"><path d="M6,19c0,1.1,0.9,2,2,2h8c1.1,0,2-0.9,2-2V7H6V19z M19,4h-3.5l-1-1h-5l-1,1H5v2h14V4z"/></svg>
          </button>
          <button class="icon-btn" id="btn-close-modal" title="Close">
            <svg viewBox="0 0 24 24"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41z"/></svg>
          </button>
        </div>
      </div>
      <div class="detail-info">
        <h3 style="margin-bottom: 1rem;">File Details</h3>
        <div class="info-row"><div class="info-label">Name:</div><div class="info-value" id="detail-name"></div></div>
        <div class="info-row"><div class="info-label">Folder:</div><div class="info-value" id="detail-folder"></div></div>
        <div class="info-row"><div class="info-label">Date:</div><div class="info-value" id="detail-date"></div></div>
        <div class="info-row"><div class="info-label">Type:</div><div class="info-value" id="detail-type"></div></div>
        <div class="info-row">
          <div class="info-label">URL:</div>
          <div class="info-value url-value" id="detail-url" title="Click to copy"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
